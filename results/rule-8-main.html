<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <link rel="canonical" href="https://korcpa.github.io/psych-assessment-finder/results/rule-8-main.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="나에게 필요한 심리평가 찾기">
  <meta property="og:title" content="추천 평가 · 종합심리평가 + 기억·집행기능평가">
  <meta property="og:description" content="종합심리평가에 기억력과 계획·조절 능력을 살펴보는 검사를 더한 평가예요.">
  <meta property="og:image" content="https://korcpa.github.io/psych-assessment-finder/assets/share-cards/rule-8-main.png">
  <meta property="og:image:width" content="1080">
  <meta property="og:image:height" content="1350">
  <meta property="og:url" content="https://korcpa.github.io/psych-assessment-finder/results/rule-8-main.html">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    * { box-sizing: border-box; }
    html { background: #f5f2eb; }
    body { margin: 0; color: #30291f; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; word-break: keep-all; }
    main { max-width: 440px; min-height: 100dvh; margin: 0 auto; padding: 20px 16px calc(28px + env(safe-area-inset-bottom)); background: #fffdfa; }
    .eyebrow { margin: 2px 0 12px; text-align: center; color: #675943; font-size: 12px; font-weight: 700; }
    h1 { margin: 0 0 8px; text-align: center; font-size: 22px; line-height: 1.35; }
    .lead { margin: 0 0 17px; text-align: center; font-size: 14px; line-height: 1.6; color: #62594c; }
    .card { display: block; width: 100%; max-width: 380px; height: auto; margin: auto; border: 1px solid #88745f; background: #fffaf1; }
    .actions { display: grid; gap: 10px; max-width: 380px; margin: 18px auto 0; }
    .button { display: grid; place-items: center; min-height: 50px; padding: 10px; border: 2px solid #493b2d; border-radius: 0; color: #2e261f; background: #f8db7e; font: inherit; font-size: 15px; font-weight: 750; text-decoration: none; text-align: center; cursor: pointer; }
    .button.secondary { background: #fffdfa; }
    .note { max-width: 380px; margin: 18px auto 0; color: #70685d; font-size: 12px; line-height: 1.55; text-align: center; }
    .credit { max-width: 380px; margin: 22px auto 0; padding-top: 12px; border-top: 1px solid #e2d9cd; color: #81786e; font-size: 11px; line-height: 1.5; text-align: center; }
    #copyStatus { min-height: 1.4em; margin: 8px 0 0; color: #384786; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">나에게 필요한 심리평가 찾기 · 공유 결과</p>
    <h1>종합심리평가 + 기억·집행기능평가</h1>
    <p class="lead">종합심리평가에 기억력과 계획·조절 능력을 살펴보는 검사를 더한 평가예요.</p>
    <img class="card" src="../assets/share-cards/rule-8-main.png" width="1080" height="1350" alt="종합심리평가 + 기억·집행기능평가 결과 카드">
    <div class="actions">
      <a class="button" href="../">나도 심리평가 찾아보기 →</a>
      <button class="button secondary" id="shareThisPage" type="button">이 결과 페이지 공유하기</button>
    </div>
    <p id="copyStatus" role="status" aria-live="polite"></p>
    <p class="note">이 페이지에는 선택한 답변이 포함되지 않아요. 평가는 전문가와 상의해 결정할 수 있어요.</p>
    <p class="credit">기획·제작: 심리실언니들 · 검수·배포: 한국임상심리사협회</p>
  </main>
  <script>
    document.getElementById("shareThisPage").addEventListener("click", async () => {
      const url = location.href;
      if (navigator.share) {
        try { await navigator.share({ title: document.title, url }); return; }
        catch (error) { if (error?.name === "AbortError") return; }
      }
      try {
        await navigator.clipboard.writeText(url);
        document.getElementById("copyStatus").textContent = "결과 페이지 주소를 복사했어요.";
      } catch (_) {
        window.prompt("이 주소를 복사해 공유해주세요.", url);
      }
    });
  </script>
</body>
</html>
